name: Fastly main deployment

on:
  push:
    branches:
      - main
    paths:
      - 'infra/fastly/**'
      - '.github/workflows/deploy-fastly.yml'
      - '.github/workflows/deploy-fastly-main.yml'

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
      FASTLY_API_TOKEN: ${{ secrets.FASTLY_API_TOKEN }}
      TF_VAR_fastly_api_token: ${{ secrets.FASTLY_API_TOKEN }}
      TF_VAR_domain_name: www.mohnish.co
      TF_VAR_apex_domain: mohnish.co
      TF_VAR_newrelic_insert_key: ${{ secrets.NEWRELIC_INSERT_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform init
        working-directory: infra/fastly
        run: terraform init

      - name: Terraform validate
        working-directory: infra/fastly
        run: terraform validate

      - name: Terraform plan
        working-directory: infra/fastly
        run: terraform plan

  terraform-apply:
    needs: terraform-plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production

    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
      FASTLY_API_TOKEN: ${{ secrets.FASTLY_API_TOKEN }}
      TF_VAR_fastly_api_token: ${{ secrets.FASTLY_API_TOKEN }}
      TF_VAR_domain_name: www.mohnish.co
      TF_VAR_apex_domain: mohnish.co
      TF_VAR_newrelic_insert_key: ${{ secrets.NEWRELIC_INSERT_KEY }}


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform init
        working-directory: infra/fastly
        run: terraform init

      - name: Terraform apply
        working-directory: infra/fastly
        run: terraform apply -auto-approve

      - name: Show Fastly TLS DNS challenge
        working-directory: infra/fastly
        run: |
          echo "TLS challenge name: $(terraform output -raw tls_challenge_name)"
          echo "TLS challenge value: $(terraform output -raw tls_challenge_value)"
