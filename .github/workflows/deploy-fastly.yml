name: Fastly static site deployment

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      FASTLY_API_TOKEN: ${{ secrets.FASTLY_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_fastly_api_token: ${{ secrets.FASTLY_API_TOKEN }}
      TF_VAR_domain_name: www.mohnishlad.com
      TF_VAR_apex_domain: mohnishlad.com
      TF_VAR_bucket_name: mohnishlad-movie-reviews
      TF_VAR_object_region: us-east

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Bootstrap Fastly object storage access key
        working-directory: infra/terraform
        run: terraform apply -target=fastly_object_storage_access_keys.site -auto-approve

      - name: Terraform plan
        working-directory: infra/terraform
        run: terraform plan

  terraform-apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      FASTLY_API_TOKEN: ${{ secrets.FASTLY_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_fastly_api_token: ${{ secrets.FASTLY_API_TOKEN }}
      TF_VAR_domain_name: www.mohnishlad.com
      TF_VAR_apex_domain: mohnishlad.com
      TF_VAR_bucket_name: mohnishlad-movie-reviews
      TF_VAR_object_region: us-east

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Bootstrap Fastly object storage access key
        working-directory: infra/terraform
        run: terraform apply -target=fastly_object_storage_access_keys.site -auto-approve

      - name: Terraform plan
        working-directory: infra/terraform
        run: terraform plan -out=tfplan

      - name: Terraform apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve tfplan
